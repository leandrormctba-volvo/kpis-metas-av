<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPIs e Metas — Associação Volvo</title>
<meta name="description" content="Menu dos painéis de KPIs e metas da Associação Volvo-Clube.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #0b0d0f;
    --teal: #14788c;
    --teal-escuro: #0c5868;
    --teal-claro: #3fa7bd;
    --laranja: #d95926;
    --texto: #f4f4f4;
    --texto-2: #a3a8b6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--fundo); color: var(--texto); }
  body {
    font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
    background:
      radial-gradient(ellipse 70% 60% at 50% 0%, rgba(20,120,140,.28), transparent 70%),
      var(--fundo);
  }
  .wrap { width: 100%; max-width: 900px; text-align: center; }
  .logo { width: min(260px, 60vw); height: auto; display: block; margin: 0 auto 22px; }
  h1 { font-size: clamp(26px, 4vw, 38px); font-weight: 800; letter-spacing: .5px; }
  .filete { width: 64px; height: 3px; border-radius: 3px; margin: 14px auto 12px; background: linear-gradient(90deg, var(--teal-claro), var(--laranja)); }
  .sub { color: var(--texto-2); font-size: 15px; margin-bottom: 34px; }

  .botoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 26px; }

  /* Botão 3D: face com gradiente + "base" sólida por baixo (box-shadow) que afunda ao clicar */
  .btn3d {
    position: relative; display: flex; align-items: center; gap: 16px;
    padding: 22px 24px; border-radius: 18px; text-decoration: none; color: #fff; text-align: left;
    background: linear-gradient(180deg, #1b93ab 0%, var(--teal) 45%, var(--teal-escuro) 100%);
    border: 1px solid rgba(255,255,255,.12);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 -3px 0 rgba(0,0,0,.18),
      0 8px 0 #063a45,
      0 18px 28px rgba(0,0,0,.55);
    transform: translateY(0);
    transition: transform .12s ease, box-shadow .12s ease, filter .2s ease;
  }
  .btn3d:hover { filter: brightness(1.08); transform: translateY(-2px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.18), 0 10px 0 #063a45, 0 22px 32px rgba(0,0,0,.6); }
  .btn3d:active { transform: translateY(7px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 -2px 0 rgba(0,0,0,.18), 0 1px 0 #063a45, 0 6px 12px rgba(0,0,0,.5); }
  .btn3d:focus-visible { outline: 3px solid var(--laranja); outline-offset: 4px; }

  .icone {
    flex: 0 0 auto; width: 56px; height: 56px; border-radius: 14px;
    display: grid; place-items: center;
    background: rgba(255,255,255,.14);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 3px 8px rgba(0,0,0,.25);
  }
  .icone svg { width: 30px; height: 30px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .titulo { font-size: 19px; font-weight: 800; line-height: 1.2; text-shadow: 0 2px 4px rgba(0,0,0,.3); }
  .desc { font-size: 13px; opacity: .85; margin-top: 4px; }
  .seta { margin-left: auto; opacity: .8; font-size: 22px; font-weight: 700; }

  @media (prefers-reduced-motion: reduce) { .btn3d { transition: none; } }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="img/logo-branco.png" alt="Associação Volvo">
    <h1>KPIs e Metas</h1>
    <div class="filete"></div>
    <p class="sub">Indicadores dos projetos da Associação Volvo-Clube. Escolha um painel.</p>

    <nav class="botoes" aria-label="Painéis">
      <!-- target="_top": abre a página do SharePoint na mesma aba, fora do quadro embutido -->
      <a class="btn3d" target="_top"
         href="https://volvogroup.sharepoint.com/sites/unit-associao-viking-AVClube/SitePages/Pesquisas-de-Satisfa%C3%A7%C3%A3o.aspx">
        <span class="icone" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg>
        </span>
        <span>
          <span class="titulo">Pesquisas de Satisfação</span>
          <span class="desc" style="display:block">Opinião dos associados por evento</span>
        </span>
        <span class="seta" aria-hidden="true">›</span>
      </a>

      <a class="btn3d" target="_top"
         href="https://volvogroup.sharepoint.com/sites/unit-associao-viking-AVClube/SitePages/Calend%C3%A1rio-de-Atividades.aspx">
        <span class="icone" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h2M14 14h2M8 18h2"/></svg>
        </span>
        <span>
          <span class="titulo">Calendário de Atividades</span>
          <span class="desc" style="display:block">Execução das atividades de 2026</span>
        </span>
        <span class="seta" aria-hidden="true">›</span>
      </a>

      <a class="btn3d" target="_top"
         href="https://volvogroup.sharepoint.com/sites/unit-associao-viking-AVClube/SitePages/Budget-2026.aspx">
        <span class="icone" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>
        </span>
        <span>
          <span class="titulo">Budget 2026</span>
          <span class="desc" style="display:block">Apresentação orçamentária 2026</span>
        </span>
        <span class="seta" aria-hidden="true">›</span>
      </a>
    </nav>
  </div>
</body>
</html>
